name: Publish DDT explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ddt-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify simulation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Rebuild current display data
        run: python -m scripts.export_explorer
      - name: Check replay and data loading
        run: |
          node tests/test_flow_replay.cjs
          node tests/test_flow_ui_contract.cjs
          node tests/test_entity_chain.cjs
          node tests/test_data_sync.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy explorer
        id: deployment
        uses: actions/deploy-pages@v4
